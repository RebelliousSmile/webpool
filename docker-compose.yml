name: webpool

services:
  db:
    image: postgres:17-alpine
    container_name: webpool-db
    environment:
      POSTGRES_DB: webpool
      POSTGRES_USER: webpool
      POSTGRES_PASSWORD: webpool
    # boucle locale seulement, IPv4 et IPv6 : "localhost" peut résoudre vers ::1
    ports:
      - "127.0.0.1:${WEBPOOL_DB_PORT:-5432}:5432"
      - "[::1]:${WEBPOOL_DB_PORT:-5432}:5432"
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - webpool_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webpool -d webpool"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  webpool_pgdata:
