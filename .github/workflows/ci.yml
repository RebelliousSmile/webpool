name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: webpool
          POSTGRES_USER: webpool
          POSTGRES_PASSWORD: webpool
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U webpool -d webpool"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      # version lue dans le champ packageManager de package.json
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # unitaires + intégration, couverture avec planchers
      - run: pnpm test:coverage
        env:
          DATABASE_URL: postgres://webpool:webpool@localhost:5432/webpool
